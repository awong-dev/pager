## NOTE:
## This config file overrides data/configs/cluster.hocon,
## and is merged with environment variables which start with 'EMQX_' prefix.
##
## Config changes made from EMQX dashboard UI, management HTTP API, or CLI
## are stored in data/configs/cluster.hocon.
## To avoid confusion, please do not store the same configs in both files.
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more details.
## Configuration full example can be found in etc/examples

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

## EMQX provides support for two primary log handlers: `file` and `console`, with an additional `audit` handler specifically designed to always direct logs to files.
## The system's default log handling behavior can be configured via the environment variable `EMQX_DEFAULT_LOG_HANDLER`, which accepts the following settings:
##
##   - `file`: Directs log output exclusively to files.
##   - `console`: Channels log output solely to the console.
##
## It's noteworthy that `EMQX_DEFAULT_LOG_HANDLER` is set to `file` when EMQX is initiated via systemd `emqx.service` file.
## In scenarios outside systemd initiation, `console` serves as the default log handler.

## Read more about configs here: https://www.emqx.io/docs/en/latest/configuration/logs.html

log {
    # file {
    #     level = warning
    # }
    # console {
    #     level = warning
    # }
}
dashboard {
    listeners {
        http {
            ## Comment out 'bind' (or set bind=0) to disable listener.
            bind = 18083
        }
        https {
            ## Uncomment to enable
            # bind = 18084
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

## docs/DEVICE_TASKS.md S2.1 / docs/DEVICE_PLAN.md §2.1, §3.2 steps 2-3:
## the broker's password + ACL is the *first* gate in front of a device (the
## relay's HMAC signature verification, docs/PROTOCOL.md §14, is the
## second, end-to-end one -- neither replaces the other). Before this block,
## EMQX shipped with `authentication = []` (anonymous allowed) and a
## `file`-backed authorization source whose default rule is `{allow, all}`
## (`docs/DEVICE_PLAN.md` §1's "Neither is provisioned anywhere" finding) --
## exactly the gap this task closes.
##
## `built_in_database` for both authentication and authorization is EMQX's
## Mnesia-backed store, managed entirely over its HTTP API by
## `relay/app/emqx_admin.py` (`ensure_device`/`delete_user`/
## `ensure_boot_user`) -- no CSV bootstrap file, no dashboard clicking.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    enable = true
    # sha256: EMQX hashes+salts the password server-side; `emqx_admin.py`
    # only ever sends the plaintext `mqttPassword`/`bpw` once, over the
    # loopback-only management API, the same trust boundary
    # `BROKER_API_KEY`/`BROKER_API_SECRET` already cross for `/publish`.
    password_hash_algorithm {
      name = sha256
    }
  }
]

authorization {
  # Deny-by-default (docs/DEVICE_TASKS.md S2.1's "deny-by-default authz"):
  # a client with no matching rule in `built_in_database` -- an unknown
  # user, or a known device user asking for a topic outside its own three
  # (docs/PROTOCOL.md §2's mirror-image ACL) -- is refused, not merely
  # unmatched-and-allowed.
  no_match = deny
  sources = [
    {
      type = built_in_database
      enable = true
    }
  ]
}
