<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pager Parent Console</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #d9dce1;
    --text: #1c1f24;
    --muted: #6b7280;
    --accent: #2563eb;
    --danger: #b91c1c;
    --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
  }
  #status-line {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .dot {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
  }
  .dot.online { background: var(--ok); }
  .dot.offline { background: var(--danger); }
  #header-buttons button {
    margin-left: 0.5rem;
    font-size: 0.8rem;
    padding: 0.3rem 0.6rem;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 6px;
    cursor: pointer;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  #settings-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  #settings-panel h2 {
    margin-top: 0;
    font-size: 1rem;
  }
  #settings-panel label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.6rem;
  }
  #settings-panel input {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    margin-top: 0.2rem;
  }
  #settings-panel button {
    margin-top: 0.8rem;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #thread {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    min-height: 4rem;
  }
  .msg {
    max-width: 80%;
    padding: 0.55rem 0.75rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 0.95rem;
    line-height: 1.35;
  }
  .msg.down { align-self: flex-end; background: #e7edff; border-color: #c3d3ff; }
  .msg.up { align-self: flex-start; background: var(--card); }
  .msg .meta {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.35rem;
  }
  .badge {
    display: inline-block;
    padding: 0.05rem 0.45rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge.queued { background: #e5e7eb; color: #374151; }
  .badge.sent { background: #dbeafe; color: #1e40af; }
  .badge.shown { background: #ede9fe; color: #5b21b6; }
  .badge.read { background: #dcfce7; color: #166534; }
  .badge.expired { background: #fee2e2; color: #991b1b; text-decoration: line-through; }
  .badge.received { background: #cffafe; color: #155e75; }
  #empty-hint {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 1rem 0;
  }
  #compose {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
  }
  #compose-body {
    flex: 1;
    resize: none;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    min-height: 2.4rem;
  }
  #compose-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.3rem;
  }
  #char-count {
    font-size: 0.75rem;
    color: var(--muted);
  }
  #char-count.over { color: var(--danger); font-weight: 600; }
  #send-btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #send-btn:disabled { background: #93b4f5; cursor: not-allowed; }
  #error-banner {
    background: #fee2e2;
    color: var(--danger);
    border: 1px solid #fca5a5;
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.85rem;
    display: none;
  }
  #error-banner.show { display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Pager Parent Console</h1>
  <div id="header-buttons">
    <span id="status-line"><span class="dot" id="status-dot"></span><span id="status-text">–</span></span>
    <button id="settings-toggle" type="button">Settings</button>
  </div>
</header>

<main>
  <section id="settings-panel" class="hidden">
    <h2>Connect to relay</h2>
    <label for="device-id-input">Device ID</label>
    <input id="device-id-input" type="text" placeholder="pgr-0001" autocomplete="off">
    <label for="token-input">Bearer token</label>
    <input id="token-input" type="password" placeholder="shared relay token" autocomplete="off">
    <button id="settings-save" type="button">Save</button>
  </section>

  <div id="error-banner"></div>

  <section id="thread">
    <div id="empty-hint">No messages yet.</div>
  </section>

  <section id="compose">
    <textarea id="compose-body" rows="2" maxlength="400" placeholder="Type a message for the pager..."></textarea>
    <div id="compose-side">
      <span id="char-count">0 / 160</span>
      <button id="send-btn" type="button">Send</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // Single dependency-free page: fetch + vanilla JS, no framework, no build step.
  // Simplicity note: the relay's GET /messages `since` filter keys off the
  // server's internal receive time (`created_at`), which is not part of the
  // JSON the API returns (only `ts`, the message's own timestamp, is). Rather
  // than track an approximate/incorrect cursor client-side, this page just
  // re-fetches the whole thread on every poll. Thread sizes for a single
  // parent/child pager are small (tens of messages), so this trades a little
  // bandwidth for correctness. A future relay change exposing `created_at`
  // (or a monotonic `seq`) in MessageOut would make a real incremental
  // `since` query worth adding here.

  const BODY_MAX_CODEPOINTS = 160;
  const POLL_INTERVAL_MS = 3000;

  const els = {
    settingsPanel: document.getElementById("settings-panel"),
    deviceIdInput: document.getElementById("device-id-input"),
    tokenInput: document.getElementById("token-input"),
    settingsSave: document.getElementById("settings-save"),
    settingsToggle: document.getElementById("settings-toggle"),
    statusDot: document.getElementById("status-dot"),
    statusText: document.getElementById("status-text"),
    errorBanner: document.getElementById("error-banner"),
    thread: document.getElementById("thread"),
    emptyHint: document.getElementById("empty-hint"),
    composeBody: document.getElementById("compose-body"),
    charCount: document.getElementById("char-count"),
    sendBtn: document.getElementById("send-btn"),
  };

  let pollHandle = null;

  function getConfig() {
    return {
      deviceId: localStorage.getItem("pager.deviceId") || "",
      token: localStorage.getItem("pager.token") || "",
    };
  }

  function setConfig(deviceId, token) {
    localStorage.setItem("pager.deviceId", deviceId);
    localStorage.setItem("pager.token", token);
  }

  function hasConfig() {
    const c = getConfig();
    return Boolean(c.deviceId && c.token);
  }

  function showSettings() {
    const c = getConfig();
    els.deviceIdInput.value = c.deviceId;
    els.tokenInput.value = c.token;
    els.settingsPanel.classList.remove("hidden");
  }

  function hideSettings() {
    els.settingsPanel.classList.add("hidden");
  }

  function showError(message) {
    els.errorBanner.textContent = message;
    els.errorBanner.classList.add("show");
  }

  function clearError() {
    els.errorBanner.classList.remove("show");
    els.errorBanner.textContent = "";
  }

  async function apiFetch(path, options) {
    const c = getConfig();
    const opts = options || {};
    opts.headers = Object.assign({}, opts.headers, {
      Authorization: "Bearer " + c.token,
    });
    const resp = await fetch(
      "/api/devices/" + encodeURIComponent(c.deviceId) + path,
      opts
    );
    return resp;
  }

  function formatTime(epochSeconds) {
    if (!epochSeconds) return "";
    const d = new Date(epochSeconds * 1000);
    return d.toLocaleString();
  }

  function renderMessages(messages) {
    els.thread.innerHTML = "";
    if (!messages.length) {
      els.thread.appendChild(els.emptyHint);
      return;
    }
    for (const m of messages) {
      const div = document.createElement("div");
      div.className = "msg " + (m.direction === "down" ? "down" : "up");

      const bodyEl = document.createElement("div");
      bodyEl.className = "body";
      bodyEl.textContent = m.body != null ? m.body : "(no body)";
      div.appendChild(bodyEl);

      const meta = document.createElement("div");
      meta.className = "meta";

      const who = document.createElement("span");
      who.textContent = m.direction === "down" ? "Parent" : "Student";
      meta.appendChild(who);

      const right = document.createElement("span");
      const badge = document.createElement("span");
      badge.className = "badge " + m.state;
      badge.textContent = m.state;
      right.appendChild(badge);
      right.appendChild(document.createTextNode(" " + formatTime(m.ts)));
      meta.appendChild(right);

      div.appendChild(meta);
      els.thread.appendChild(div);
    }
  }

  async function pollMessages() {
    try {
      const resp = await apiFetch("/messages", { method: "GET" });
      if (resp.status === 401) {
        showError("Bearer token rejected by relay (401). Check Settings.");
        showSettings();
        stopPolling();
        return;
      }
      if (!resp.ok) {
        showError("Failed to load messages: HTTP " + resp.status);
        return;
      }
      const data = await resp.json();
      clearError();
      renderMessages(data);
    } catch (err) {
      showError("Could not reach relay: " + err.message);
    }
  }

  async function pollStatus() {
    try {
      const resp = await apiFetch("/status", { method: "GET" });
      if (resp.status === 404) {
        els.statusDot.className = "dot";
        els.statusText.textContent = "no status yet";
        return;
      }
      if (resp.status === 401) {
        // Already surfaced by pollMessages; avoid double error banners.
        return;
      }
      if (!resp.ok) {
        els.statusDot.className = "dot";
        els.statusText.textContent = "status unavailable (HTTP " + resp.status + ")";
        return;
      }
      const data = await resp.json();
      const isOnline = data.state === "online";
      els.statusDot.className = "dot " + (isOnline ? "online" : "offline");
      let text = data.state;
      if (isOnline && data.mode) {
        text += " (" + data.mode + ")";
      }
      els.statusText.textContent = text;
    } catch (err) {
      els.statusDot.className = "dot";
      els.statusText.textContent = "status unavailable";
    }
  }

  function poll() {
    pollMessages();
    pollStatus();
  }

  function startPolling() {
    stopPolling();
    poll();
    pollHandle = setInterval(poll, POLL_INTERVAL_MS);
  }

  function stopPolling() {
    if (pollHandle !== null) {
      clearInterval(pollHandle);
      pollHandle = null;
    }
  }

  function updateCharCount() {
    const len = Array.from(els.composeBody.value).length; // count code points
    els.charCount.textContent = len + " / " + BODY_MAX_CODEPOINTS;
    const over = len > BODY_MAX_CODEPOINTS || len === 0;
    els.charCount.classList.toggle("over", len > BODY_MAX_CODEPOINTS);
    els.sendBtn.disabled = over;
  }

  async function sendMessage() {
    const body = els.composeBody.value;
    if (!body || Array.from(body).length > BODY_MAX_CODEPOINTS) {
      return;
    }
    els.sendBtn.disabled = true;
    try {
      const resp = await apiFetch("/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: body }),
      });
      if (!resp.ok) {
        let detail = "HTTP " + resp.status;
        try {
          const errJson = await resp.json();
          if (errJson && errJson.detail) detail = errJson.detail;
        } catch (e) {
          // ignore parse failure, fall back to status code
        }
        showError("Send failed: " + detail);
        return;
      }
      clearError();
      els.composeBody.value = "";
      updateCharCount();
      await pollMessages();
    } catch (err) {
      showError("Could not reach relay: " + err.message);
    } finally {
      updateCharCount();
    }
  }

  els.settingsToggle.addEventListener("click", function () {
    if (els.settingsPanel.classList.contains("hidden")) {
      showSettings();
    } else {
      hideSettings();
    }
  });

  els.settingsSave.addEventListener("click", function () {
    const deviceId = els.deviceIdInput.value.trim();
    const token = els.tokenInput.value.trim();
    if (!deviceId || !token) {
      showError("Both device ID and bearer token are required.");
      return;
    }
    setConfig(deviceId, token);
    clearError();
    hideSettings();
    startPolling();
  });

  els.composeBody.addEventListener("input", updateCharCount);
  els.sendBtn.addEventListener("click", sendMessage);
  els.composeBody.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ---- boot ----
  updateCharCount();
  if (hasConfig()) {
    hideSettings();
    startPolling();
  } else {
    showSettings();
  }
})();
</script>
</body>
</html>
