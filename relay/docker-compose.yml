# For local development only — do not use in production

version: "3.8"

services:
  # docs/SERVER_PLAN.md §2 decision 2: EMQX OSS locally (same rule engine +
  # REST publish API as EMQX Cloud Serverless in prod). Pinned to 5.8.0
  # rather than the "5" tag, which does not exist as a manifest.
  emqx:
    image: emqx/emqx:5.8.0
    ports:
      - "1883:1883" # MQTT, for the device (real or simulated)
      - "18083:18083" # dashboard/management REST API (setup script + relay's REST publish)
    volumes:
      # Pre-seeds a known api_key:api_secret pair (matches relay's
      # BROKER_API_KEY/BROKER_API_SECRET in .env) so the relay's REST-publish
      # credential is known up front -- no chicken-and-egg with a
      # dynamically generated key the relay would need to be told about
      # after EMQX starts. See relay/README.md.
      - ./emqx/bootstrap_api_keys.txt:/opt/emqx/data/bootstrap_api_keys.txt:ro
    environment:
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/data/bootstrap_api_keys.txt
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - pager-net

  relay:
    build: .
    depends_on:
      emqx:
        condition: service_healthy
      firebase:
        condition: service_healthy
      twilio-mock:
        condition: service_started
    env_file: .env
    environment:
      # docs/SERVER_PLAN.md §5.9: emulator-aware (app/db/firestore.py),
      # pointed at the `firebase` service on the compose network. Overrides
      # anything conflicting in .env so the compose stack is correct
      # regardless of what a developer's .env happens to have.
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      GOOGLE_CLOUD_PROJECT: demo-pager
      DEV_MODE: "1"
      # Phase 7: app/backends/sms_twilio.py's (app/notify/sms.py's)
      # TWILIO_BASE_URL override, pointed at the twilio-mock service on the
      # compose network (see that service's own comment below). No
      # PUBLIC_BASE_URL/TWILIO_AUTH_TOKEN/GCHAT_AUDIENCE here -- this compose
      # stack exercises outbound sms only (tools/e2e_v2.py's `fanout`
      # scenario); nothing in it POSTs to /webhooks/twilio/sms or
      # /webhooks/gchat with a real signature/JWT, so those stay unset
      # (fail-closed, per each module's own docstring) rather than
      # configured with a value that would only be correct for a real
      # deployment.
      TWILIO_BASE_URL: http://twilio-mock:8010
      # Phase 8 hardening: rate limits (app/store/rate_limits.py) default to
      # real, meaningfully-bounded production values (relay/.env.example) --
      # too tight for tools/e2e_v2.py's full 9-scenario run, which makes 30+
      # admin writes and several backend-creation calls against one shared
      # admin/user identity in normal operation. This compose stack is
      # local/test-only (DEV_MODE=1 above), so these overrides are safe here
      # specifically; never set limits this high in a real deployment's .env.
      RATE_LIMIT_BACKEND_CREATE_LIMIT: "1000"
      RATE_LIMIT_ADMIN_WRITE_LIMIT: "1000"
      RATE_LIMIT_WEBHOOK_IP_LIMIT: "1000"
    ports:
      - "8000:8000"
    networks:
      - pager-net

  # docs/SERVER_PLAN.md §2 decision 3 / §5.9: Firestore is the only store
  # and Firebase Auth is the identity provider -- both run as local
  # emulators (relay/emulator.Dockerfile), the same containers pytest and
  # tools/e2e_v2.py (via the relay) talk to.
  firebase:
    build:
      context: .
      dockerfile: emulator.Dockerfile
    ports:
      - "8080:8080" # Firestore emulator
      - "9099:9099" # Auth emulator
      - "4000:4000" # Emulator Suite UI
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/', r => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - pager-net

  # Phase 5 (docs/SERVER_PLAN.md §6.4/§8 scenario 7): a Twilio-Messages-API-
  # shaped test double, never a real dependency -- `app/backends/sms_stub.py`
  # (and, in Phase 7, the real `sms_twilio.py`) point at it via
  # TWILIO_BASE_URL. See tools/mocks/twilio_mock.py's module docstring.
  twilio-mock:
    build:
      context: ../tools/mocks
    ports:
      - "8010:8010"
    networks:
      - pager-net

networks:
  pager-net:
    driver: bridge
