[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    # docs/SERVER_PLAN.md §2 decision 3 / Phase 2b: Firestore is the only
    # store and Firebase Auth is the identity provider; firebase-admin
    # (which bundles google-cloud-firestore) is how the relay talks to both,
    # emulator-aware via FIRESTORE_EMULATOR_HOST/FIREBASE_AUTH_EMULATOR_HOST.
    "firebase-admin",
]

[project.optional-dependencies]
# paho-mqtt is no longer a relay runtime dependency (docs/SERVER_PLAN.md §2
# decision 1: the relay never holds an MQTT connection) -- it stays a dev
# dependency because tools/e2e_test.py and tools/sim_device.py are simulated
# *devices* that speak real MQTT to the broker, and they're documented to
# run from this same venv (relay/.venv/bin/python3).
dev = ["pytest", "httpx", "paho-mqtt"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
