[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    # docs/SERVER_PLAN.md §2 decision 3 / Phase 2b: Firestore is the only
    # store and Firebase Auth is the identity provider; firebase-admin
    # (which bundles google-cloud-firestore) is how the relay talks to both,
    # emulator-aware via FIRESTORE_EMULATOR_HOST/FIREBASE_AUTH_EMULATOR_HOST.
    "firebase-admin",
    # Phase 7 (docs/SERVER_PLAN.md §6.5): already an indirect dependency of
    # firebase-admin, declared explicitly now that app/backends/gchat.py
    # imports it directly for Google-issued JWT verification
    # (google.auth.jwt/crypt) and ADC (google.auth.default) for the outbound
    # Chat API call.
    "google-auth",
    # Phase 7 (docs/SERVER_PLAN.md §5 tasks.py line): app/tasks.py's
    # CloudTasksQueue (TASKS_MODE=cloud_tasks).
    "google-cloud-tasks",
    # Phase 7: `POST /webhooks/twilio/sms` parses Twilio's
    # application/x-www-form-urlencoded body via Starlette's
    # `Request.form()`, which requires this package even for non-multipart
    # forms.
    "python-multipart",
]

[project.optional-dependencies]
# paho-mqtt is no longer a relay runtime dependency (docs/SERVER_PLAN.md §2
# decision 1: the relay never holds an MQTT connection) -- it stays a dev
# dependency because tools/e2e_test.py and tools/sim_device.py are simulated
# *devices* that speak real MQTT to the broker, and they're documented to
# run from this same venv (relay/.venv/bin/python3).
dev = ["pytest", "httpx", "paho-mqtt"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
